services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openxe:bizrock
    environment:
      - SERVICE_FQDN_APP_80
      - WFDB_HOST=mysql
      - WFDB_PORT=3306
      - WFDB_NAME=${MYSQL_DATABASE}
      - WFDB_USER=${MYSQL_USER}
      - WFDB_PASSWORD=${MYSQL_PASSWORD}
      - WFUSERDATA=/var/www/html/userdata
    volumes:
      - userdata:/var/www/html/userdata
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost/www/index.php > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      app_init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy

  app_init:
    image: openxe:bizrock
    working_dir: /var/www/html/upgrade
    command: ["php", "data/upgrade.php", "-db", "-do"]
    restart: "no"
    environment:
      - WFDB_HOST=mysql
      - WFDB_PORT=3306
      - WFDB_NAME=${MYSQL_DATABASE}
      - WFDB_USER=${MYSQL_USER}
      - WFDB_PASSWORD=${MYSQL_PASSWORD}
      - WFUSERDATA=/var/www/html/userdata
    volumes:
      - userdata:/var/www/html/userdata
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MARIADB_AUTO_UPGRADE: "1"
    # Tuning params as CLI args — the bind-mount approach (./docker/mariadb.cnf
    # -> /etc/mysql/conf.d/openxe.cnf) did not work under Coolify's build
    # context (Docker silently created an empty directory when the host file
    # wasn't resolvable). CLI args are bulletproof across contexts.
    command:
      - --innodb_buffer_pool_size=4G
      - --innodb_buffer_pool_instances=8
      - --innodb_log_file_size=1G
      - --innodb_log_buffer_size=10M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_thread_concurrency=6
      - --innodb_stats_on_metadata=OFF
      - --innodb_strict_mode=OFF
      - --innodb_file_per_table=ON
      - --sort_buffer_size=8M
      - --join_buffer_size=8M
      - --read_buffer_size=2M
      - --read_rnd_buffer_size=16M
      - --tmp_table_size=128M
      - --max_heap_table_size=128M
      - --key_buffer_size=128M
      - --myisam_sort_buffer_size=128M
      - --bulk_insert_buffer_size=64M
      - --max_connections=512
      - --max_allowed_packet=64M
      - --thread_cache_size=32
      - --table_open_cache=2048
      - --table_definition_cache=1024
      - --open_files_limit=65535
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --init-connect=SET NAMES utf8mb4
      - --explicit_defaults_for_timestamp=1
      - --log_bin_trust_function_creators=1
      - --skip-log-bin
    # Nur auf localhost des Hosts gebunden - von aussen unerreichbar,
    # gedacht fuer SSH-Tunnel (z.B. -L 3311:127.0.0.1:3306).
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      interval: 5s
      retries: 3
      test:
        ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 30s

volumes:
  mysqldata:
  userdata:
