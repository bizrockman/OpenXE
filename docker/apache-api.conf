<Directory /var/www>
    AllowOverride All
</Directory>
<Directory /var/www/html>
    AllowOverride All
</Directory>

# Override the default "combined" log format to include request time.
# %D is server-side processing time in microseconds. Without this we
# cannot tell whether a slow request spent its time in PHP/DB (logged
# here) or upstream in Traefik (not logged here). conf-enabled/*.conf
# is processed before sites-enabled/*.conf, so this override takes
# effect for the CustomLog "combined" reference in 000-default.conf.
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %Dus" combined
