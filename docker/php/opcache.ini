; OPcache tuning for OpenXE under PHP 8.1 (mod_php / Apache prefork).
;
; The defaults that ship with the php:8.1-apache image have two issues
; for a code-heavy ERP like OpenXE:
;   1. opcache.jit is "tracing" but opcache.jit_buffer_size is 0, so JIT
;      is effectively disabled. PHP 8.1+ JIT gives a measurable speedup
;      on dispatcher-heavy, loop-heavy code — which Xentral 19.4 on
;      PHP 7.2 never had.
;   2. opcache.revalidate_freq defaults to 2s, so every request restats
;      every .php file at most every 2s. We bump it to 60s — on Coolify
;      every deploy rebuilds the image fresh anyway, so a stale
;      window of up to 60s is fine.
;
; Also raised memory_consumption, max_accelerated_files, and
; interned_strings_buffer to comfortably hold the full OpenXE + vendor
; tree (~5900 .php files) without evicting.
;
; save_comments=1 is kept on because some vendor libs (Doctrine, JMS,
; Symfony DI) read PHPDoc annotations at runtime.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
opcache.fast_shutdown=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
